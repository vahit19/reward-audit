name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --python 3.12 --with pytest python -m pytest -q
      - run: uv run --no-project --python 3.12 python experiments/run_demo.py --check
      - run: uv run --no-project --python 3.12 --with math-verify==0.9.0 --with latex2sympy2_extended==1.11.0 python experiments/verifier_audit.py --check
