[project]
name = "reward-audit"
version = "0.1.0"
description = "When the grader is the weak link in RL: catch a broken reward while training runs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vahit FERYAD", email = "vahit.feryat@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reward_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
